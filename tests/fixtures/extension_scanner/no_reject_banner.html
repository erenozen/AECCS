<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>No Reject Banner</title>
  <style>
    .cookie-banner {
      position: fixed;
      inset: auto 24px 24px 24px;
      padding: 20px;
      background: #ffffff;
      color: #111827;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-family: sans-serif;
    }

    .cookie-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .cookie-actions button {
      padding: 12px 18px;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <section class="cookie-banner" role="dialog" aria-modal="true">
    <h2>Cookie choices</h2>
    <p>We use cookies for analytics and advertising. Review our privacy policy before continuing.</p>
    <div class="cookie-actions">
      <button>Accept All</button>
    </div>
  </section>
</body>
</html>
