<!DOCTYPE html>
<html lang="en">
<head>

  <title>Iframe-hosted Sourcepoint Consent</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
    }

    main {
      padding: 2rem;
    }

    #sp_message_container_1325650 {
      position: fixed;
      inset: auto 1rem 1rem 1rem;
      width: min(46rem, calc(100vw - 2rem));
      height: 18rem;
      border: 0;
      background: rgba(15, 23, 42, 0.08);
    }

    #sp_message_iframe_1325650 {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sky-style iframe consent host</h1>
    <p>The actionable consent controls live in the iframe below rather than in the top document.</p>
  </main>

  <div id="sp_message_container_1325650" aria-modal="true" role="dialog">
    <iframe
      src="sourcepoint_iframe_inner.html"
      id="sp_message_iframe_1325650"

    ></iframe>
  </div>

</html>
