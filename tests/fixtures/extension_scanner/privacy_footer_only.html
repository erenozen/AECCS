<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Privacy Footer Only</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
      font-family: sans-serif;
    }

    main {
      min-height: 100vh;
      padding: 32px;
    }

    footer {
      position: fixed;
      inset: auto 0 0 0;
      background: #111827;
      border-top: 1px solid #334155;
      padding: 16px 28px;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.5;
    }

    footer a {
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <main>
    <h1>Example page</h1>
    <p>No cookie banner is currently shown.</p>
  </main>

  <footer>
    Read our <a href="/privacy">Privacy Policy</a> and <a href="/cookies">Cookie Policy</a>.
  </footer>
</body>
</html>
