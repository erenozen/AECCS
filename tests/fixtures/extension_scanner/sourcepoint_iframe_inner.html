<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Iframe Sourcepoint Banner</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #ffffff;
    }

    #sp_message_container_2 {
      height: 100vh;
      box-sizing: border-box;
      padding: 1.25rem;
      border: 1px solid #d0d7de;
      background: #ffffff;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      font: inherit;
    }

    .primary {
      background: #0f62fe;
      color: #ffffff;
    }

    .secondary {
      background: #eef2ff;
      color: #1f2937;
    }
  </style>
</head>
<body>
  <div
    id="sp_message_container_2"
    class="message sp_choice_type_12"
    role="dialog"
    aria-modal="true"
    data-cmp-vendor="sourcepoint"
    data-host="privacy-mgmt"
  >
    <h2>Your privacy choices</h2>
    <p>
      We use cookies and similar technologies to support the site, analyse traffic,
      and personalise content. Choose whether to accept all cookies, keep essential
      cookies only, or view options.
    </p>
    <div class="actions">
      <button type="button" class="primary">Accept all</button>
      <button type="button" class="secondary">Essential cookies only</button>
      <button type="button" class="secondary">View options</button>
    </div>
  </div>
</body>
</html>
