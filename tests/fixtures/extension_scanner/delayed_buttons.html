<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delayed Buttons Banner</title>
  <style>
    .cookie-consent-shell {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 20px;
      background: #111827;
      color: #f9fafb;
      font-family: sans-serif;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 18px;
    }

    .actions button {
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="cookie-consent-shell">
    <div class="consent-copy">
      We use cookies to improve the experience and show advertising.
    </div>
    <div class="actions" id="actions-root"></div>
  </div>

  <script>
    window.setTimeout(() => {
      const actions = document.getElementById("actions-root");
      actions.innerHTML = `
        <button>Reject All</button>
        <button>Accept All</button>
      `;
    }, 220);
  </script>
</body>
</html>
