<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings Path Banner</title>
  <style>
    .consent-banner {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 520px;
      padding: 22px;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 18px;
      font-family: sans-serif;
    }

    .consent-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 20px;
    }

    .consent-actions button {
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <section class="consent-banner" role="dialog">
    <h2>Privacy choices</h2>
    <p>We use cookies for analytics and advertising. You can manage or reject non-essential cookies in your settings.</p>
    <div class="consent-actions">
      <button>Manage Preferences</button>
      <button>Accept All</button>
    </div>
  </section>
</body>
</html>
